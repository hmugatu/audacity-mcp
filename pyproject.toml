[project]
name = "audacity-mcp"
version = "0.1.0"
description = "MCP server for controlling Audacity via Claude"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp[cli]>=1.0.0"]

[project.urls]
Homepage = "https://github.com/tachyonshuggy/audacity-mcp"
Issues   = "https://github.com/tachyonshuggy/audacity-mcp/issues"

[project.scripts]
audacity-mcp = "audacity_mcp.server:main"

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
